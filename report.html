<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reports - Personal Ledger</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ["Outfit", "sans-serif"],
            },
            colors: {
              primary: "#6366f1", // Indigo 500
              secondary: "#8b5cf6", // Violet 500
              success: "#10b981", // Emerald 500
              danger: "#ef4444", // Red 500
              darkbg: "#0f172a", // Slate 900
            },
          },
        },
      };
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- FontAwesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- html2pdf.js (Keeping for now if needed, though user requested XLSX) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- SheetJS (XLSX) -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body
    class="bg-gray-50 text-gray-800 dark:bg-darkbg dark:text-gray-100 font-sans transition-colors duration-300 min-h-screen flex flex-col"
  >
    <!-- Navbar -->
    <nav
      id="navbar"
      class="bg-white/80 dark:bg-slate-800/80 backdrop-blur-md shadow-sm sticky top-0 z-50 transition-colors duration-300 border-b border-gray-100 dark:border-slate-700"
    >
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16 items-center">
          <!-- Left: Back to Dashboard -->
          <a href="index.html" class="flex items-center group no-print">
            <div
              class="w-10 h-10 rounded-xl bg-primary/10 flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-white transition duration-300"
            >
              <i class="fa-solid fa-arrow-left"></i>
            </div>
            <span
              class="ml-3 font-semibold text-gray-600 dark:text-gray-300 group-hover:text-primary transition"
              >Back</span
            >
          </a>

          <!-- Center: Title -->
          <div class="hidden md:flex flex-col items-center">
            <span
              class="font-bold text-xl tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-primary to-secondary"
            >
              Financial Reports
            </span>
            <span class="text-xs text-gray-400">Monthly & Yearly Analysis</span>
          </div>

          <!-- Right: Theme Toggle -->
          <button
            onclick="toggleTheme()"
            class="w-10 h-10 rounded-xl bg-gray-100 dark:bg-slate-700 flex items-center justify-center hover:bg-gray-200 dark:hover:bg-slate-600 transition duration-300 text-gray-600 dark:text-gray-300 no-print"
          >
            <i id="theme-icon" class="fa-solid fa-moon text-lg"></i>
          </button>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main
      id="report-content"
      class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full"
    >
      <!-- Controls Section -->
      <div
        class="bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-gray-100 dark:border-slate-700 mb-8 no-print"
      >
        <div
          class="flex flex-col md:flex-row gap-6 justify-between items-center"
        >
          <!-- Report Type Toggle -->
          <div
            class="flex bg-gray-100 dark:bg-slate-700 p-1 rounded-xl w-full md:w-auto"
          >
            <button
              id="btn-monthly"
              onclick="setReportType('monthly')"
              class="flex-1 px-6 py-2 rounded-lg text-sm font-semibold transition-all duration-300 shadow-sm bg-white dark:bg-slate-600 text-primary"
            >
              Monthly
            </button>
            <button
              id="btn-yearly"
              onclick="setReportType('yearly')"
              class="flex-1 px-6 py-2 rounded-lg text-sm font-semibold text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 transition-all duration-300"
            >
              Yearly
            </button>
          </div>

          <!-- Date Selectors & Download -->
          <div
            class="flex flex-wrap md:flex-nowrap gap-4 w-full md:w-auto items-center"
          >
            <select
              id="select-year"
              onchange="updateReport()"
              class="flex-1 md:w-32 px-4 py-2 rounded-xl border-2 border-transparent bg-gray-50 dark:bg-slate-900 focus:border-primary focus:outline-none transition font-medium"
            >
              <!-- Years populated by JS -->
            </select>
            <select
              id="select-month"
              onchange="updateReport()"
              class="flex-1 md:w-40 px-4 py-2 rounded-xl border-2 border-transparent bg-gray-50 dark:bg-slate-900 focus:border-primary focus:outline-none transition font-medium"
            >
              <option value="0">January</option>
              <option value="1">February</option>
              <option value="2">March</option>
              <option value="3">April</option>
              <option value="4">May</option>
              <option value="5">June</option>
              <option value="6">July</option>
              <option value="7">August</option>
              <option value="8">September</option>
              <option value="9">October</option>
              <option value="10">November</option>
              <option value="11">December</option>
            </select>
            <button
              onclick="downloadExcel()"
              class="flex items-center gap-2 bg-success hover:bg-emerald-600 text-white px-5 py-2 rounded-xl font-medium transition shadow-lg shadow-emerald-500/30 active:scale-95"
            >
              <i class="fa-solid fa-file-excel"></i> Download Excel
            </button>
          </div>
        </div>
      </div>

      <!-- Summary Cards -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div
          class="bg-gradient-to-br from-indigo-500 to-indigo-600 rounded-2xl p-6 text-white shadow-lg shadow-indigo-500/20 relative overflow-hidden group"
        >
          <div
            class="absolute right-0 top-0 w-32 h-32 bg-white/10 rounded-full blur-2xl transform translate-x-10 -translate-y-10 group-hover:bg-white/20 transition duration-500"
          ></div>
          <p class="text-indigo-100 font-medium mb-1">Total Income</p>
          <h3 id="report-income" class="text-3xl font-bold tracking-tight">
            ৳0.00
          </h3>
          <div class="mt-4 flex items-center text-indigo-100 text-sm">
            <i class="fa-solid fa-arrow-trend-up mr-2"></i> Earned
          </div>
        </div>

        <div
          class="bg-gradient-to-br from-rose-500 to-rose-600 rounded-2xl p-6 text-white shadow-lg shadow-rose-500/20 relative overflow-hidden group"
        >
          <div
            class="absolute right-0 top-0 w-32 h-32 bg-white/10 rounded-full blur-2xl transform translate-x-10 -translate-y-10 group-hover:bg-white/20 transition duration-500"
          ></div>
          <p class="text-rose-100 font-medium mb-1">Total Expense</p>
          <h3 id="report-expense" class="text-3xl font-bold tracking-tight">
            ৳0.00
          </h3>
          <div class="mt-4 flex items-center text-rose-100 text-sm">
            <i class="fa-solid fa-arrow-trend-down mr-2"></i> Spent
          </div>
        </div>

        <div
          class="bg-gradient-to-br from- emerald-500 to-emerald-600 rounded-2xl p-6 text-white shadow-lg shadow-emerald-500/20 relative overflow-hidden group"
        >
          <!-- Fix gradient class from- emerald to from-emerald -->
          <div
            class="absolute inset-0 bg-gradient-to-br from-emerald-500 to-emerald-600"
          ></div>
          <div
            class="absolute right-0 top-0 w-32 h-32 bg-white/10 rounded-full blur-2xl transform translate-x-10 -translate-y-10 group-hover:bg-white/20 transition duration-500 relative z-10"
          ></div>
          <div class="relative z-10">
            <p class="text-emerald-100 font-medium mb-1">Net Balance</p>
            <h3 id="report-balance" class="text-3xl font-bold tracking-tight">
              ৳0.00
            </h3>
            <div class="mt-4 flex items-center text-emerald-100 text-sm">
              <i class="fa-solid fa-wallet mr-2"></i> Savings
            </div>
          </div>
        </div>
      </div>

      <!-- Charts Layout -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
        <!-- Main Bar Chart -->
        <div
          class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-slate-700"
        >
          <h3
            class="text-lg font-bold mb-6 text-gray-800 dark:text-white flex items-center"
          >
            <div
              class="w-8 h-8 rounded-lg bg-blue-100 dark:bg-blue-900/30 text-blue-500 flex items-center justify-center mr-3"
            >
              <i class="fa-solid fa-chart-simple"></i>
            </div>
            Only Expenses Analysis
          </h3>
          <div class="relative h-72">
            <canvas id="mainChart"></canvas>
          </div>
        </div>

        <!-- Categories Breakdown -->
        <div
          class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-slate-700"
        >
          <h3
            class="text-lg font-bold mb-6 text-gray-800 dark:text-white flex items-center"
          >
            <div
              class="w-8 h-8 rounded-lg bg-purple-100 dark:bg-purple-900/30 text-purple-500 flex items-center justify-center mr-3"
            >
              <i class="fa-solid fa-chart-pie"></i>
            </div>
            Category Breakdown
          </h3>
          <div class="relative h-72 flex justify-center">
            <canvas id="categoryChart"></canvas>
          </div>
        </div>
      </div>

      <!-- Detailed Table -->
      <div
        class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-gray-100 dark:border-slate-700 overflow-hidden"
      >
        <div
          class="p-6 border-b border-gray-100 dark:border-slate-700 flex justify-between items-center"
        >
          <h3 class="text-lg font-bold text-gray-800 dark:text-white">
            Detailed Statement
          </h3>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left">
            <thead class="bg-gray-50 dark:bg-slate-750/50">
              <tr>
                <th
                  class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider"
                >
                  Date
                </th>
                <th
                  class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider"
                >
                  Category
                </th>
                <th
                  class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider"
                >
                  Description
                </th>
                <th
                  class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider text-right"
                >
                  Income
                </th>
                <th
                  class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider text-right"
                >
                  Expense
                </th>
              </tr>
            </thead>
            <tbody
              id="report-table-body"
              class="divide-y divide-gray-100 dark:divide-slate-700"
            >
              <!-- Rows -->
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <script src="report.js"></script>
  </body>
</html>
